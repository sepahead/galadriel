[package]
name = "galadriel-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "A demonstration, replay, and fail-closed observer for Galadriel's Mirror."
publish = false

[lints]
workspace = true

[[bin]]
name = "galadriel"
path = "src/main.rs"

[dependencies]
galadriel-core = { workspace = true }
galadriel-sim = { workspace = true }
galadriel-dependence = { workspace = true, optional = true }
galadriel-ncp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "signal", "time"] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
clap = { workspace = true }
anyhow = { workspace = true }

[features]
default = []
# This feature selects the optional pairwise-MI dependence companion and pid-core.
# Demonstration command: `cargo run --features dependence -- demo`.
dependence = ["dep:galadriel-dependence"]
# This feature selects Neuro-Cybernetic Protocol (NCP) sidecar ingestion and ncp-core.
# It adds `replay <jsonl>`.
ncp = ["dep:galadriel-ncp"]
# This feature selects the two-route receiver, runtime, and JSON output encoder.
ncp-live = [
    "ncp",
    "galadriel-ncp/zenoh",
    "dep:tokio",
    "dep:serde",
    "dep:serde_json",
]
