[package]
name = "galadriel-local-adapter"
version = "0.9.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["Sepehr Mahmoudian"]
repository = "https://github.com/sepahead/galadriel"
description = "Bounded, advisory scalar NIS adapter for Galadriel's exploratory magnitude detector."
readme = "README.md"
publish = false

[workspace]
resolver = "2"

[lints.rust]
unsafe_code = "forbid"

[features]
default = []
ncp-loop = ["dep:ncp", "dep:serde", "dep:serde_json"]

[dependencies]
galadriel-core = { version = "=0.9.0", path = "../galadriel-core" }
sha2 = "0.11"
thiserror = "2"
ncp = { package = "sepahead-ncp-core", version = "=2.0.0", git = "https://github.com/sepahead/NCP", rev = "2e24ef5b89feb3f1e4f4972e290201d93e2d0a8d", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "galadriel-ncp-loop"
path = "src/bin/galadriel-ncp-loop.rs"
required-features = ["ncp-loop"]

[profile.release]
lto = "thin"
