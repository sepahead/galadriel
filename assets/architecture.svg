<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">Galadriel: two advisory evidence paths</title>
<desc id="desc">The full core validates comparable observations, computes magnitude and signed consistency, and returns a sealed advisory report. The scalar adapter uses magnitude only. Its current one-Visual NCP input retains insufficient evidence. Missingness is never zero. MI accompanies the unchanged report; PID remains offline. No path grants command authority.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="var(--accent)"/></marker></defs>
<style>
:root{--bg:#f6f7fb;--card:#ffffff;--ink:#1c2537;--muted:#4e5d72;--line:#ccd5e3;--accent:#a52f55;--soft:#faedf2;--teal:#136b71;--tealsoft:#eaf5f5}
@media(prefers-color-scheme:dark){:root{--bg:#101722;--card:#182230;--ink:#eaf0f7;--muted:#b6c5d6;--line:#3b4d61;--accent:#ff96b3;--soft:#302331;--teal:#7ed9d4;--tealsoft:#153034}}
text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}
.title{font-family:Georgia,serif;font-size:38px;font-weight:700}
.subtitle{font-size:21px;fill:var(--muted)}
.label{font-size:16px;letter-spacing:2px;font-weight:700;fill:var(--accent)}
.heading{font-size:25px;font-weight:700}
.body{font-size:21px;fill:var(--muted)}
.note{font-size:19px;fill:var(--muted)}
.edge{fill:none;stroke:var(--accent);stroke-width:2.5;marker-end:url(#arrow)}
.rule{stroke:var(--line);stroke-width:1.5}
</style>
<rect width="1200" height="860" rx="24" fill="var(--bg)"/>
<text class="title"><tspan x="44" y="62">Galadriel’s Mirror</tspan></text><text class="subtitle"><tspan x="44" y="103">Statistical evidence for inspection. No command authority.</tspan></text><text class="label"><tspan x="44" y="159">01  FULL CORE · STANDALONE RUST</tspan></text><rect x="44" y="184" width="340" height="202" rx="16" fill="var(--card)" stroke="var(--line)"/><path d="M62 206v158" stroke="var(--accent)" stroke-width="4"/><text class="heading"><tspan x="80" y="227">Comparable inputs</tspan></text><text class="body"><tspan x="80" y="266">One track · exact sequence</tspan><tspan x="80" y="295">Scope, frame, context, prior</tspan><tspan x="80" y="324">Fresh required modalities</tspan><tspan x="80" y="353">Signed common projection</tspan></text><rect x="430" y="184" width="340" height="202" rx="16" fill="var(--card)" stroke="var(--line)"/><path d="M448 206v158" stroke="var(--accent)" stroke-width="4"/><text class="heading"><tspan x="466" y="227">Two evidence layers</tspan></text><text class="body"><tspan x="466" y="266">Magnitude: NIS + CUSUM</tspan><tspan x="466" y="295">Signed consistency</tspan><tspan x="466" y="324">Conservative fusion</tspan><tspan x="466" y="353">No mixed-frame fallback</tspan></text><rect x="816" y="184" width="340" height="202" rx="16" fill="var(--card)" stroke="var(--line)"/><path d="M834 206v158" stroke="var(--accent)" stroke-width="4"/><text class="heading"><tspan x="852" y="227">Sealed advisory report</tspan></text><text class="body"><tspan x="852" y="266">Exact scope + input binding</tspan><tspan x="852" y="295">Nominal, anomaly, or</tspan><tspan x="852" y="324">insufficient evidence</tspan><tspan x="852" y="353">Invalid input → error</tspan></text><path class="edge" d="M391 284h30"/><path class="edge" d="M777 284h30"/><text class="label"><tspan x="44" y="431">02  SCALAR ADAPTER · OPTIONAL LOCAL NCP</tspan></text><rect x="44" y="456" width="340" height="202" rx="16" fill="var(--card)" stroke="var(--line)"/><path d="M62 478v158" stroke="var(--teal)" stroke-width="4"/><text class="heading"><tspan x="80" y="499">Actual body response</tspan></text><text class="body"><tspan x="80" y="538">One Visual modality / entity</tspan><tspan x="80" y="567">NIS + degrees of freedom</tspan><tspan x="80" y="596">Exact plan, time, provenance</tspan><tspan x="80" y="625">No invented sensor channel</tspan></text><rect x="430" y="456" width="340" height="202" rx="16" fill="var(--card)" stroke="var(--line)"/><path d="M448 478v158" stroke="var(--teal)" stroke-width="4"/><text class="heading"><tspan x="466" y="499">Exploratory magnitude</tspan></text><text class="body"><tspan x="466" y="538">Existing core engine</tspan><tspan x="466" y="567">32 samples + 2 modalities</tspan><tspan x="466" y="596">Named 64-sample window</tspan><tspan x="466" y="625">No signed-consistency layer</tspan></text><rect x="816" y="456" width="340" height="202" rx="16" fill="var(--card)" stroke="var(--line)"/><path d="M834 478v158" stroke="var(--teal)" stroke-width="4"/><text class="heading"><tspan x="852" y="499">Record-only result</tspan></text><text class="body"><tspan x="852" y="538">One Visual stays insufficient</tspan><tspan x="852" y="567">Missing active input retires</tspan><tspan x="852" y="596">Exact response held for ACK</tspan><tspan x="852" y="625">No calibrated posterior</tspan></text><path class="edge" d="M391 556h30"/><path class="edge" d="M777 556h30"/><path class="rule" d="M44 702h1112"/><text class="note"><tspan x="44" y="742">Separate research: optional MI accompanies the unchanged core verdict. PID remains an offline study.</tspan></text><text class="note"><tspan x="44" y="776">Integrity is not producer authentication. Channel attribution does not identify intent or a physical cause.</tspan></text><text class="note"><tspan x="44" y="810">The local adapter is a component interface. Installed ecosystem and research release gates remain open.</tspan></text></svg>
