<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1920" viewBox="0 0 1800 1920" role="img" aria-labelledby="title desc" xml:lang="en" focusable="false">
  <title id="title">CREBAIN synthetic drone fixture to Galadriel categorical MGW evidence</title>
  <desc id="desc">Publication diagram of Galadriel's exact CREBAIN categorical study. One physically parameterized synthetic producer program creates latent east, north, and up coordinates, ordered pre-fusion visual, radar, and acoustic observations, and two categorical targets. Target derivation reads the latent truth, but does not read serialized source fields, sensor projections, fusion output, Galadriel verdicts, or PID results. This is data-flow separation, not producer independence or a claim that target derivation precedes sensor projection in time. The retained fixture proves row-level prior and observation timestamps. Stronger cross-modality synchronization provenance comes from the pinned producer source. Each of 64 rows uses a fresh fusion engine and retains only a bounded six-field fusion summary. The projection_count receipt field proves three admitted observations. The common_projection_prior_id field proves that at least one projection is present and every present projection uses prior 2. Neither field proves that all three observations carried a non-None consistency projection. Eight repeats of each source cell test fresh-instance bounded-summary reproducibility, not full-state isolation or inferential precision. The empirical laws are uniform independent binary visual, radar, and acoustic sources with horizontal target equal to visual AND radar and volumetric target equal to visual AND radar AND acoustic. The immutable producer preregistration names pid-rs revision 1cd2424f and unbudgeted discrete sxpid entry points. Galadriel adapts that fixed estimand to clean pid-core 0.9.0 revision bc3aa80 and the explicit with-budget entry points. The wire model separates four layers. The paper functional is functional.shared-exclusions.mgw-categorical. The raw-row empirical-PMF sample-estimator route is route.shared-exclusions.mgw-empirical-pmf. The upstream implementation-method catalog identity is shared-exclusions.categorical. The concrete entry points are pid_core::stable::categorical::discrete_sxpid2_with_budget and pid_core::stable::categorical::discrete_sxpid3_with_budget. Raw rows produce a plug-in empirical-PMF estimate. They do not evaluate a separately declared population law. Exact cell balance makes the empirical PMF coincide with the canonical law for this fixture only. PID2 is primary and PID3 is exploratory. The study retains pointwise and averaged outputs. Its dependency-disjoint 80-digit Decimal route compares only the 66 averaged informative, misinformative, and signed net atom components. It does not compare pointwise output. The separate 108-coordinate averaged cumulative-plus-atom PID3 assurance program remains open. Exact identities, asymmetric source-position canaries, nine per-call resource preflights, algebra checks, and interpretation guards lead only to record-only advisory evidence. For fixed admitted authority inputs, Haldir authorization, trusted-state policy, and plant-command outputs are identical across PID record states. Audit records may vary, and no operator-behavior noninterference is claimed.</desc>
