  <rect width="1800" height="1920" fill="#F7F3E9"/>
  <text x="55" y="58" class="title">A fixed estimand from synthetic drone geometry—not from a fused verdict</text>
  <text x="55" y="96" class="subtitle">Every solid arrow is a typed data-flow edge. Red barriers mark deliberately absent decision and authority edges.</text>
  <line x1="55" y1="112" x2="1745" y2="112" class="title-rule" aria-hidden="true"/>
  <line x1="55" y1="116" x2="255" y2="116" class="title-rule-accent" aria-hidden="true"/>
  <path d="M1745 106 L1751 112 L1745 118 L1739 112 Z" class="registration-diamond" aria-hidden="true"/>

  <rect x="40" y="125" width="1720" height="475" rx="22" class="lane"/>
  <text x="68" y="159" class="section">1 · PHYSICALLY PARAMETERIZED SYNTHETIC LAW</text>

  <rect x="70" y="185" width="390" height="345" rx="16" class="truth"/>
  <rect x="92" y="204" width="186" height="28" rx="14" fill="#087f5b"/>
  <text x="185" y="223" text-anchor="middle" class="badge">PRODUCER PROGRAM</text>
  <text x="92" y="270" class="node-title">Latent map-frame truth</text>
  <text x="92" y="308" class="equation">p = (E, N, U) in map_enu</text>
  <text x="92" y="340" class="body">Planes: E ≤ 50 m · N ≤ 1 m</text>
  <text x="92" y="368" class="body">U ≤ 1 m</text>
  <line x1="92" y1="386" x2="438" y2="386" class="divider"/>
  <text x="92" y="414" class="small">All 8 binary source cells are generated.</text>
  <text x="92" y="440" class="small">Each cell has 8 fresh-engine episodes.</text>
  <text x="92" y="475" class="tiny">One producer creates both branches.</text>
  <text x="92" y="499" class="tiny">The target is not producer-independent.</text>

  <path d="M460 325 H512" class="arrow-green"/>
  <path d="M512 325 L497 316 L497 334 Z" class="arrowhead-green" aria-hidden="true"/>
  <path d="M460 325 H484 V176 H1200 V208" class="arrow-green"/>
  <path d="M1200 208 L1191 193 L1209 193 Z" class="arrowhead-green" aria-hidden="true"/>
  <text x="805" y="169" text-anchor="middle" class="tiny">latent-truth branch</text>

  <rect x="520" y="185" width="585" height="345" rx="16" class="physical"/>
  <rect x="542" y="204" width="186" height="28" rx="14" fill="#1769aa"/>
  <text x="635" y="223" text-anchor="middle" class="badge">ORDERED SOURCES</text>
  <text x="542" y="270" class="node-title">Pre-fusion sensor symbols</text>
  <text x="542" y="309" class="equation">V = 1[N_visual ≤ 1 m]</text>
  <text x="542" y="343" class="equation">R = 1[E_radar ≤ 50 m]</text>
  <text x="542" y="377" class="equation">A = 1[U_acoustic ≤ 1 m]</text>
  <line x1="542" y1="400" x2="1083" y2="400" class="divider"/>
  <text x="542" y="432" class="body">Source order is fixed: S = (V, R, A).</text>
  <text x="542" y="463" class="small">No fused verdict or target-derived feature enters S.</text>
  <text x="542" y="491" class="small">Asymmetric PID2 and PID3 canaries protect positions.</text>

  <line x1="1132" y1="198" x2="1132" y2="518" class="nonedge"/>
  <rect x="1113" y="326" width="38" height="38" rx="19" fill="#fff0ef" stroke="#b42318" stroke-width="2"/>
  <path d="M1122 335 L1142 355 M1142 335 L1122 355" stroke="#b42318" stroke-width="3"/>
  <text x="1132" y="548" text-anchor="middle" class="tiny danger-text">NO SERIALIZED SOURCE-FIELD READ</text>

  <rect x="1170" y="185" width="560" height="345" rx="16" class="truth"/>
  <rect x="1192" y="204" width="186" height="28" rx="14" fill="#087f5b"/>
  <text x="1285" y="223" text-anchor="middle" class="badge">NAMED TARGETS</text>
  <text x="1192" y="270" class="node-title">Targets from the latent ENU branch</text>
  <text x="1192" y="309" class="equation">T_H = 1[E ≤ 50 ∧ N ≤ 1] = V ∧ R</text>
  <text x="1192" y="343" class="equation">T_V = T_H · 1[U ≤ 1] = V ∧ R ∧ A</text>
  <line x1="1192" y1="367" x2="1708" y2="367" class="divider"/>
  <text x="1192" y="399" class="small">Derivation reads latent truth only.</text>
  <text x="1192" y="427" class="small">It does not read projections, fusion, verdicts, or PID.</text>
  <text x="1192" y="466" class="tiny">This is data-flow independence. It is not a claim that</text>
  <text x="1192" y="490" class="tiny">target derivation occurs before sensor projection in time.</text>

  <path d="M812 530 V620" class="arrow"/>
  <path d="M812 620 L803 605 L821 605 Z" class="arrowhead" aria-hidden="true"/>
  <path d="M1450 530 V620" class="arrow"/>
  <path d="M1450 620 L1441 605 L1459 605 Z" class="arrowhead" aria-hidden="true"/>

  <rect x="40" y="625" width="1720" height="330" rx="22" class="lane"/>
  <text x="68" y="659" class="section">2 · ROW, SYNCHRONIZATION, AND CUSTODY CONTRACT</text>

  <rect x="70" y="685" width="510" height="225" rx="16" class="contract"/>
  <text x="92" y="721" class="node-title">One row = one fresh engine episode</text>
  <text x="92" y="756" class="equation">prior timestamp = 1000 ms</text>
  <text x="92" y="784" class="equation">row timestamp = 1100 ms</text>
  <text x="92" y="815" class="body">64 unique episode IDs · 8 cells × 8 repeats</text>
  <text x="92" y="846" class="small">Fixture proof: one row-level window timestamp.</text>
  <text x="92" y="875" class="small">Producer-source proof: modality synchronization.</text>
  <text x="92" y="900" class="tiny">The row does not independently retain per-modality times.</text>

  <path d="M580 798 H615" class="arrow"/>
  <path d="M615 798 L600 789 L600 807 Z" class="arrowhead" aria-hidden="true"/>

  <rect x="625" y="685" width="530" height="225" rx="16" class="contract"/>
  <text x="647" y="721" class="node-title">Bounded six-field fusion summary</text>
  <text x="647" y="751" class="mono-small">common_projection_prior_id · degraded</text>
  <text x="647" y="776" class="mono-small">input_count · projection_count</text>
  <text x="647" y="801" class="mono-small">truncated · v1_expected_count</text>
  <line x1="647" y1="808" x2="1133" y2="808" class="divider"/>
  <text x="647" y="828" class="small">Three admitted observations are proven.</text>
  <text x="647" y="847" class="tiny">At least one projection is present.</text>
  <text x="647" y="866" class="tiny">Every present projection uses prior 2.</text>
  <text x="647" y="885" class="tiny">Not proven: all three projections are non-None.</text>
  <text x="647" y="904" class="tiny">Fresh-instance equality covers this summary only.</text>

  <path d="M1155 798 H1190" class="arrow"/>
  <path d="M1190 798 L1175 789 L1175 807 Z" class="arrowhead" aria-hidden="true"/>

  <rect x="1200" y="685" width="530" height="225" rx="16" class="contract"/>
  <text x="1222" y="721" class="node-title">Exact bytes and empirical PMF</text>
  <text x="1222" y="758" class="body">CREBAIN 6ef60fab… · 64,218 bytes</text>
  <text x="1222" y="790" class="mono-small">fixture SHA-256  82a83741…ebda</text>
  <text x="1222" y="821" class="mono-small">manifest SHA-256 4b0381be…f90</text>
  <text x="1222" y="859" class="small">Uniform independent V, R, A ∼ Bernoulli(½).</text>
  <text x="1222" y="888" class="tiny">Repeated mass defines the PMF. It adds no inferential precision.</text>

  <path d="M900 955 V985" class="arrow-purple"/>
  <path d="M900 985 L891 970 L909 970 Z" class="arrowhead-purple" aria-hidden="true"/>

  <rect x="40" y="985" width="1720" height="455" rx="22" class="lane"/>
  <text x="68" y="1019" class="section">3 · FOUR-LAYER MGW METHOD MODEL AND OUTPUTS</text>

  <rect x="70" y="1045" width="405" height="340" rx="16" class="functional"/>
  <rect x="92" y="1065" width="156" height="28" rx="14" fill="#a15c00"/>
  <text x="170" y="1084" text-anchor="middle" class="badge">FUNCTIONAL</text>
  <text x="92" y="1126" class="node-title">Categorical MGW</text>
  <text x="92" y="1155" class="node-title">shared-exclusions functional</text>
  <text x="92" y="1180" class="mono-tiny">functional.shared-exclusions.mgw-categorical</text>
  <text x="92" y="1210" class="body">Paper-defined pointwise cumulatives</text>
  <text x="92" y="1238" class="body">and Möbius atoms on a categorical law.</text>
  <text x="92" y="1274" class="equation">Π_α = Π⁺_α − Π⁻_α</text>
  <text x="92" y="1310" class="small">Natural-log units · signed values retained</text>
  <text x="92" y="1338" class="small">Measure-relative · associational · non-causal</text>
  <text x="92" y="1370" class="tiny">The functional does not define the route or budget.</text>

  <path d="M475 1215 H515" class="arrow-purple"/>
  <path d="M515 1215 L500 1206 L500 1224 Z" class="arrowhead-purple" aria-hidden="true"/>

  <rect x="525" y="1045" width="585" height="340" rx="16" class="pid"/>
  <rect x="547" y="1065" width="300" height="28" rx="14" fill="#6f42c1"/>
  <text x="697" y="1084" text-anchor="middle" class="badge">ROUTE · METHOD · ENTRY POINTS</text>
  <text x="547" y="1124" class="node-title">Raw rows → empirical PMF → atoms</text>
  <text x="547" y="1155" class="mono-tiny">route.shared-exclusions.mgw-empirical-pmf</text>
  <text x="547" y="1180" class="mono-tiny">method/catalog = shared-exclusions.categorical</text>
  <text x="547" y="1215" class="small">Exact implementation entry points</text>
  <text x="547" y="1242" class="mono-tiny">pid_core::stable::categorical::discrete_sxpid2_with_budget</text>
  <text x="547" y="1267" class="mono-tiny">pid_core::stable::categorical::discrete_sxpid3_with_budget</text>
  <text x="547" y="1302" class="tiny">Raw rows form a plug-in PMF. They do not evaluate a declared law.</text>
  <text x="547" y="1327" class="tiny">Exact balance matches the canonical law for this fixture only.</text>
  <text x="547" y="1352" class="tiny">Nine executed calls retain explicit resource preflights.</text>
  <text x="547" y="1375" class="tiny">The preregistration and selected revision remain byte-bound.</text>

  <path d="M1110 1215 H1150" class="arrow-purple"/>
  <path d="M1150 1215 L1135 1206 L1135 1224 Z" class="arrowhead-purple" aria-hidden="true"/>

  <rect x="1160" y="1045" width="570" height="340" rx="16" class="pid"/>
  <rect x="1182" y="1065" width="116" height="28" rx="14" fill="#6f42c1"/>
  <text x="1240" y="1084" text-anchor="middle" class="badge">OUTPUTS</text>
  <text x="1182" y="1131" class="node-title">Two fixed source–target questions</text>
  <text x="1182" y="1170" class="body">PID2 primary: 4 averaged atoms + pointwise rows</text>
  <text x="1182" y="1201" class="body">PID3 exploratory: 18 averaged atoms + pointwise rows</text>
  <text x="1182" y="1242" class="equation">3 × (4 + 18) = 66 averaged components</text>
  <text x="1182" y="1281" class="small">Informative, misinformative, and signed net.</text>
  <text x="1182" y="1320" class="small">Open PID3 assurance: 108 averaged</text>
  <text x="1182" y="1347" class="small">cumulative-plus-atom coordinates.</text>
  <text x="1182" y="1374" class="tiny">This exact fixture does not close that separate program.</text>

  <path d="M900 1440 V1470" class="arrow"/>
  <path d="M900 1470 L891 1455 L909 1455 Z" class="arrowhead" aria-hidden="true"/>

  <rect x="40" y="1470" width="1720" height="255" rx="22" class="check"/>
  <text x="68" y="1504" class="section">4 · BOUNDED CORROBORATION AND HOSTILE CONTROLS</text>

  <rect x="70" y="1530" width="510" height="155" rx="14" fill="#ffffff" stroke="#d6b36a" stroke-width="1.8"/>
  <text x="92" y="1564" class="node-title">Finite-law and algebra checks</text>
  <text x="92" y="1600" class="small">AND2 closed forms · seven PID3 subset identities</text>
  <text x="92" y="1630" class="small">Pointwise → averaged weighting · negative atoms retained</text>
  <text x="92" y="1660" class="tiny">Tolerance 10⁻¹² nats. A pass is not a general theorem.</text>

  <rect x="645" y="1530" width="510" height="155" rx="14" fill="#ffffff" stroke="#d6b36a" stroke-width="1.8"/>
  <text x="667" y="1564" class="node-title">Identity and source-order controls</text>
  <text x="667" y="1600" class="small">Exact bytes · nominal interpretation · support keys</text>
  <text x="667" y="1630" class="small">Asymmetric PID2/PID3 source-position canaries</text>
  <text x="667" y="1660" class="tiny">Target rotations isolate informative-invariance premises.</text>

  <rect x="1220" y="1530" width="510" height="155" rx="14" fill="#ffffff" stroke="#d6b36a" stroke-width="1.8"/>
  <text x="1242" y="1564" class="node-title">Dependency-disjoint numerical route</text>
  <text x="1242" y="1600" class="small">80-digit event-union and Möbius calculation</text>
  <text x="1242" y="1630" class="small">Compares 66/66 averaged components only</text>
  <text x="1242" y="1660" class="tiny">It does not independently recompute pointwise coordinates.</text>

  <path d="M900 1725 V1754" class="arrow"/>
  <path d="M900 1754 L891 1739 L909 1739 Z" class="arrowhead" aria-hidden="true"/>

  <rect x="40" y="1754" width="1720" height="106" rx="18" class="advisory"/>
  <text x="68" y="1790" class="node-title">Record-only Galadriel research evidence</text>
  <text x="68" y="1824" class="body">A future Haldir record may reference an exact artifact. Version 0.9.0 has no Haldir adapter or runtime edge.</text>
  <rect x="1358" y="1776" width="350" height="54" rx="14" class="firewall"/>
  <text x="1533" y="1799" text-anchor="middle" class="badge-dark danger-text">NO DECISION EDGE</text>
  <text x="1533" y="1821" text-anchor="middle" class="tiny danger-text">no FusedVerdict · no Haldir policy</text>

  <line x1="900" y1="1860" x2="900" y2="1883" class="nonedge"/>
  <path d="M872 1868 L928 1882 M928 1868 L872 1882" class="nonedge"/>
  <text x="900" y="1902" text-anchor="middle" class="tiny danger-text">Fixed authority input ⇒ identical authorization, trusted-state policy, and plant-command outputs. Audit record may vary.</text>
</svg>
