  <text x="937" y="799" class="node-title">Typed research result</text>
  <text x="937" y="831" class="body">Red · Unique₁ · Unique₂ · Syn</text>
  <text x="937" y="859" class="body">Question, references, trial reports</text>
  <text x="937" y="883" class="small">Synthetic/theoretical evidence only</text>
  <path d="M845 782 H880 V830 H915" class="research-arrow"/>
  <path d="M845 877 H880 V830 H915" class="research-arrow"/>
  <path d="M903 823 L915 830 L903 837 Z" class="arrowhead-purple"/>

  <rect x="1415" y="765" width="255" height="130" rx="14" class="node failure"/>
  <text x="1437" y="799" class="node-title">Authority firewall</text>
  <text x="1437" y="831" class="body">No grant · no command</text>
  <text x="1437" y="859" class="body">No refresh · no restore</text>
  <text x="1437" y="883" class="small">Nominal is never authorization.</text>
