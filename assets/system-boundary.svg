  <rect width="1720" height="1020" fill="#ffffff"/>

  <text x="58" y="58" class="title">Galadriel 0.9 — evidence flow and authority boundary</text>
  <text x="58" y="91" class="subtitle">Implemented operational evidence is solid. Descriptive research is dashed. Every unavailable estimand fails closed.</text>

  <rect x="45" y="125" width="1650" height="535" rx="18" class="lane"/>
  <text x="70" y="158" class="section">OPERATIONAL ADMISSION AND CORE DETECTOR VERDICT</text>

  <rect x="70" y="205" width="265" height="160" rx="14" class="node neutral"/>
  <text x="92" y="239" class="node-title">Producer</text>
  <text x="92" y="271" class="body">Frozen prior per sequence</text>
  <text x="92" y="299" class="body">Declared frame and context</text>
  <text x="92" y="327" class="body">Association outcomes</text>
  <text x="92" y="349" class="small">External authorization is separate.</text>

  <rect x="385" y="185" width="270" height="105" rx="14" class="node neutral"/>
  <text x="407" y="219" class="node-title">Observation sidecar</text>
  <text x="407" y="249" class="body">NIS, innovation, projection</text>
  <text x="407" y="274" class="small">Exact route and schema</text>

  <rect x="385" y="315" width="270" height="105" rx="14" class="node neutral"/>
  <text x="407" y="349" class="node-title">Monitor sidecar</text>
  <text x="407" y="379" class="body">Misses, outcomes, summaries</text>
  <text x="407" y="404" class="small">Heartbeat and sequence</text>

  <path d="M335 255 H370 V237 H385" class="solid-arrow"/>
  <path d="M373 230 L385 237 L373 244 Z" class="arrowhead"/>
  <path d="M335 315 H370 V367 H385" class="solid-arrow"/>
  <path d="M373 360 L385 367 L373 374 Z" class="arrowhead"/>

  <rect x="705" y="185" width="320" height="245" rx="14" class="node admission"/>
  <text x="727" y="220" class="node-title">Assembly + lifecycle gate</text>
  <text x="727" y="253" class="body">Route, registry, replay, deadline</text>
  <text x="727" y="283" class="body">and prior-identity checks</text>
  <line x1="727" y1="301" x2="1003" y2="301" class="divider"/>
  <text x="727" y="329" class="equation">position = (session, epoch,</text>
  <text x="727" y="351" class="equation">stream, generation,</text>
  <text x="727" y="373" class="equation">sequence, timestamp,</text>
  <text x="727" y="395" class="equation">clock domain)</text>
  <text x="727" y="413" class="small">Only complete, exact successors cross.</text>

  <path d="M655 237 H705" class="solid-arrow"/>
  <path d="M693 230 L705 237 L693 244 Z" class="arrowhead"/>
  <path d="M655 367 H680 V315 H705" class="solid-arrow"/>
  <path d="M693 308 L705 315 L693 322 Z" class="arrowhead"/>

  <rect x="1090" y="175" width="275" height="152" rx="14" class="node magnitude"/>
  <text x="1112" y="209" class="node-title">Magnitude evidence</text>
  <text x="1112" y="241" class="equation">q = yᵀ S⁻¹ y</text>
  <text x="1112" y="269" class="body">Right-tail NIS</text>
  <text x="1112" y="291" class="small">Two-arm CUSUM</text>
  <text x="1112" y="313" class="small">Core dof=3: lower arm inert.</text>

  <rect x="1090" y="335" width="275" height="145" rx="14" class="node consistency"/>
  <text x="1112" y="369" class="node-title">Signed consistency</text>
  <text x="1112" y="401" class="equation">ρ_ab = Pearson(X_a, X_b)</text>
  <text x="1112" y="429" class="body">Positive strict-majority clique</text>
  <text x="1112" y="457" class="small">Common producer-declared gauge</text>

  <path d="M1025 265 H1053 V240 H1090" class="solid-arrow"/>
  <path d="M1078 233 L1090 240 L1078 247 Z" class="arrowhead"/>
  <path d="M1025 330 H1053 V407 H1090" class="solid-arrow"/>
  <path d="M1078 400 L1090 407 L1078 414 Z" class="arrowhead"/>

  <rect x="1415" y="230" width="255" height="205" rx="14" class="node fusion"/>
  <text x="1437" y="266" class="node-title">Conservative fusion</text>
  <text x="1437" y="298" class="body">Complete magnitude report</text>
  <text x="1437" y="326" class="body">+ signed consistency state</text>
  <line x1="1437" y1="343" x2="1648" y2="343" class="divider"/>
  <text x="1437" y="374" class="body">Accepted advisory verdict</text>
  <text x="1437" y="401" class="small">Nominal ≠ permission</text>
  <text x="1437" y="423" class="small">Cause remains unclassified.</text>

  <path d="M1365 240 H1385 V292 H1415" class="solid-arrow"/>
  <path d="M1403 285 L1415 292 L1403 299 Z" class="arrowhead"/>
  <path d="M1365 407 H1385 V365 H1415" class="solid-arrow"/>
  <path d="M1403 358 L1415 365 L1403 372 Z" class="arrowhead"/>

  <rect x="705" y="485" width="320" height="115" rx="14" class="node failure"/>
  <text x="727" y="519" class="node-title">Fail closed</text>
  <text x="727" y="551" class="body">Abstain · reject · terminal fault</text>
  <text x="727" y="579" class="small">Missing evidence never becomes nominal.</text>
  <path d="M865 430 V485" class="failure-arrow"/>
  <path d="M858 473 L865 485 L872 473 Z" class="arrowhead-red"/>
  <text x="878" y="462" class="small">incomplete / invalid</text>

  <rect x="1090" y="500" width="275" height="140" rx="14" class="node research"/>
  <text x="1112" y="534" class="node-title">Pairwise KSG-MI</text>
  <text x="1112" y="558" class="body">Complete pair graph</text>
  <text x="1112" y="583" class="small">No noise · nats · descriptive</text>
  <text x="1112" y="603" class="small">Library · demo · eval · bench</text>
  <text x="1112" y="621" class="small">Not replay · observe · NCP</text>
  <path d="M1053 407 V562 H1090" class="research-arrow"/>
  <path d="M1078 555 L1090 562 L1078 569 Z" class="arrowhead-purple"/>

  <rect x="1415" y="500" width="255" height="110" rx="14" class="node research"/>
  <text x="1437" y="534" class="node-title">Companion report</text>
  <text x="1437" y="563" class="body">Separation / no separation /</text>
  <text x="1437" y="589" class="body">unavailable — never fused</text>
  <path d="M1365 562 H1415" class="research-arrow"/>
  <path d="M1403 555 L1415 562 L1403 569 Z" class="arrowhead-purple"/>

  <rect x="45" y="695" width="1650" height="245" rx="18" class="lane"/>
  <text x="70" y="728" class="section">SEPARATE OFFLINE PID RESEARCH — NO OPERATIONAL OR AUTHORITY EDGE</text>

  <rect x="70" y="765" width="350" height="130" rx="14" class="node neutral"/>
  <text x="92" y="799" class="node-title">Fixed scientific question</text>
  <text x="92" y="831" class="body">Ordered sources (S₁, S₂)</text>
  <text x="92" y="859" class="body">Predeclared target T + exact law</text>
  <text x="92" y="883" class="small">Gauge, rows, units, software identity</text>

  <rect x="490" y="745" width="355" height="85" rx="14" class="node research"/>
  <text x="512" y="774" class="node-title">Categorical shared exclusions</text>
  <text x="512" y="798" class="small">Makkeh · Gutknecht · Wibral</text>
  <text x="512" y="816" class="small">Native nats · aggregate atoms: bits</text>

  <rect x="490" y="840" width="355" height="75" rx="14" class="node research"/>
  <text x="512" y="874" class="node-title">Continuous Ehrlich PID2</text>
  <text x="512" y="900" class="small">Distinct functional and estimator · nats</text>

