      .research-arrow { fill: none; stroke: #6f42c1; stroke-width: 3; stroke-dasharray: 10 8; }
      .failure-arrow { fill: none; stroke: #b42318; stroke-width: 3; }
      .arrowhead { fill: #243b53; }
      .arrowhead-purple { fill: #6f42c1; }
      .arrowhead-red { fill: #b42318; }
