<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1020" viewBox="0 0 1720 1020" role="img" aria-labelledby="title desc" xml:lang="en" focusable="false">
  <title id="title">Galadriel 0.9 evidence flow and authority boundary</title>
  <desc id="desc">A left-to-right system diagram. A conforming producer sends exact observation and monitor sidecars into a bounded cross-route assembler and typed lifecycle admission gate. Accepted frames feed two core detector evidence paths: per-channel NIS and CUSUM magnitude evidence, and signed-correlation consistency evidence in a producer-declared common projection. Conservative fusion produces a raw advisory report. Invalid or incomplete input abstains, rejects, or faults. A dashed, non-authoritative branch computes an optional geometry-gated pairwise KSG mutual-information report. This branch is an opt-in in-process library companion with executable use in the synthetic demo, evaluation, and benchmark. Replay, observe, and NCP do not invoke it. A separate lower galadriel-justify research lane evaluates categorical Makkeh-Gutknecht-Wibral PID or continuous Ehrlich PID only for fixed ordered sources and a predeclared target with explicit provenance. Neither mutual information nor PID enters fusion, and Galadriel has no command or authority-grant path.</desc>
