<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1760" viewBox="0 0 520 1760" role="img" aria-labelledby="title desc">
<title id="title">Galadriel: two advisory evidence paths — mobile layout</title>
<desc id="desc">The full core validates comparable observations, computes magnitude and signed consistency, and returns a sealed advisory report. The scalar adapter uses magnitude only. Its current one-Visual NCP input retains insufficient evidence. Missingness is never zero. MI accompanies the unchanged report; PID remains offline. No path grants command authority.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="var(--accent)"/></marker></defs>
<style>
:root{--bg:#f6f7fb;--card:#ffffff;--ink:#1c2537;--muted:#4e5d72;--line:#ccd5e3;--accent:#a52f55;--soft:#faedf2;--teal:#136b71;--tealsoft:#eaf5f5}
@media(prefers-color-scheme:dark){:root{--bg:#101722;--card:#182230;--ink:#eaf0f7;--muted:#b6c5d6;--line:#3b4d61;--accent:#ff96b3;--soft:#302331;--teal:#7ed9d4;--tealsoft:#153034}}
text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}
.title{font-family:Georgia,serif;font-size:38px;font-weight:700}
.subtitle{font-size:21px;fill:var(--muted)}
.label{font-size:16px;letter-spacing:2px;font-weight:700;fill:var(--accent)}
.heading{font-size:25px;font-weight:700}
.body{font-size:21px;fill:var(--muted)}
.note{font-size:19px;fill:var(--muted)}
.edge{fill:none;stroke:var(--accent);stroke-width:2.5;marker-end:url(#arrow)}
.rule{stroke:var(--line);stroke-width:1.5}
</style>
<rect width="520" height="1760" rx="24" fill="var(--bg)"/>
<text class="title"><tspan x="28" y="57">Galadriel’s Mirror</tspan></text><text class="subtitle"><tspan x="28" y="98">Statistical evidence for inspection.</tspan><tspan x="28" y="127">No command authority.</tspan></text><text class="label"><tspan x="28" y="179">01  FULL CORE · STANDALONE</tspan></text><rect x="28" y="201" width="464" height="181" rx="16" fill="var(--card)" stroke="var(--line)"/><path d="M46 223v137" stroke="var(--accent)" stroke-width="4"/><text class="heading"><tspan x="64" y="244">Comparable inputs</tspan></text><text class="body"><tspan x="64" y="283">One track · exact sequence</tspan><tspan x="64" y="312">Scope, frame, context, frozen prior</tspan><tspan x="64" y="341">Fresh required modalities</tspan><tspan x="64" y="370">Signed common projection</tspan></text><path class="edge" d="M260 392v27"/><rect x="28" y="432" width="464" height="181" rx="16" fill="var(--card)" stroke="var(--line)"/><path d="M46 454v137" stroke="var(--accent)" stroke-width="4"/><text class="heading"><tspan x="64" y="475">Two evidence layers</tspan></text><text class="body"><tspan x="64" y="514">Magnitude: NIS + CUSUM</tspan><tspan x="64" y="543">Signed consistency</tspan><tspan x="64" y="572">Conservative fusion</tspan><tspan x="64" y="601">No mixed-frame fallback</tspan></text><path class="edge" d="M260 623v27"/><rect x="28" y="663" width="464" height="181" rx="16" fill="var(--card)" stroke="var(--line)"/><path d="M46 685v137" stroke="var(--accent)" stroke-width="4"/><text class="heading"><tspan x="64" y="706">Sealed advisory report</tspan></text><text class="body"><tspan x="64" y="745">Exact scope + input binding</tspan><tspan x="64" y="774">Nominal, anomaly, or insufficiency</tspan><tspan x="64" y="803">Invalid input returns an error</tspan><tspan x="64" y="832">No causal or authority verdict</tspan></text><text class="label"><tspan x="28" y="894">02  SCALAR · OPTIONAL LOCAL NCP</tspan></text><rect x="28" y="916" width="464" height="181" rx="16" fill="var(--card)" stroke="var(--line)"/><path d="M46 938v137" stroke="var(--teal)" stroke-width="4"/><text class="heading"><tspan x="64" y="959">Actual body response</tspan></text><text class="body"><tspan x="64" y="998">One Visual modality per entity</tspan><tspan x="64" y="1027">NIS + degrees of freedom</tspan><tspan x="64" y="1056">Exact plan, time, source diagnostics</tspan><tspan x="64" y="1085">No invented sensor channel</tspan></text><path class="edge" d="M260 1107v27"/><rect x="28" y="1147" width="464" height="181" rx="16" fill="var(--card)" stroke="var(--line)"/><path d="M46 1169v137" stroke="var(--teal)" stroke-width="4"/><text class="heading"><tspan x="64" y="1190">Exploratory magnitude</tspan></text><text class="body"><tspan x="64" y="1229">Existing core engine</tspan><tspan x="64" y="1258">32 samples + 2 modalities required</tspan><tspan x="64" y="1287">Named 64-sample window</tspan><tspan x="64" y="1316">One Visual stays insufficient</tspan></text><path class="edge" d="M260 1338v27"/><rect x="28" y="1378" width="464" height="150" rx="16" fill="var(--card)" stroke="var(--line)"/><path d="M46 1400v106" stroke="var(--teal)" stroke-width="4"/><text class="heading"><tspan x="64" y="1421">Record-only result</tspan></text><text class="body"><tspan x="64" y="1460">Missing active input retires</tspan><tspan x="64" y="1489">Exact response retained for ACK</tspan><tspan x="64" y="1518">No calibrated posterior</tspan></text><path class="rule" d="M28 1562h464"/><text class="note"><tspan x="28" y="1596">MI accompanies the unchanged verdict.</tspan><tspan x="28" y="1625">PID remains an offline study.</tspan><tspan x="28" y="1654">Integrity does not authenticate a producer.</tspan><tspan x="28" y="1683">Attribution does not identify physical cause.</tspan><tspan x="28" y="1712">Installed and research release gates stay open.</tspan></text></svg>
